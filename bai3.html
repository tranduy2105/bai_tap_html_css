<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bài 3 — Danh Sách Tính Năng</title>

    <!-- ============================================================
    BÀI 3: DANH SÁCH TÍNH NĂNG VỚI ::before
    CSS viết TRONG THẺ <style> ngay bên dưới — KHÔNG tách file riêng
    Yêu cầu:
      - Danh sách ít nhất 5 tính năng của Shop App
      - Bỏ hoàn toàn style mặc định của ul/li
      - Mỗi dòng tự thêm icon ✓ phía trước bằng CSS (::before) — KHÔNG gõ vào HTML
      - Mỗi dòng có thanh màu bên trái (border-left)
      - Hover vào dòng thì background đổi màu mượt
    Gợi ý kỹ thuật: ::before | content | list-style: none | border-left | transition | :hover
  ============================================================ -->

    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: Arial, sans-serif;
        background: #f8faff;
        padding: 40px;
      }

      .section-title {
        font-size: 24px;
        font-weight: 700;
        color: #1f3864;
        margin-bottom: 6px;
        /* Gợi ý: thêm position: relative để dùng ::after */
      }

      /* --- GẠCH CHÂN NGẮN DƯỚI TIÊU ĐỀ bằng ::after ---
      Gợi ý:
        content: '';
        position: absolute;
        bottom: -6px; left: 0;
        width: 50px; height: 3px;
        background: #1F3864;
        border-radius: 2px;
    */
      .section-title::after {
        content: " ";
        position: absolute;
        bottom: -6px;
        left: 0;
        width: 50px;
        height: 3px;
        background: #1f3864;
        border-radius: 2px;
      }

      /* --- DANH SÁCH ul ---
      Gợi ý:
        list-style: none;
        padding: 0;
        margin-top: 24px;
    */
      .feature-list {
        list-style: none;
        padding: 0;
        margin-top: 24px;
      }

      /* --- TỪNG DÒNG li ---
      Gợi ý:
          position: relative;   ← cần cho ::before
          padding: 14px 14px 14px 44px;
          border-left: 4px solid #2E5496;
          border-bottom: 1px solid #eee;
          background: white;
          transition: background 0.2s ease;
          cursor: default;
    */
      .feature-list li {
        position: relative;
        padding: 14px 14px 14px 44px;
        border-left: 4px solid #2e5496;
        border-bottom: 1px solid #eee;
        background: white;
        transition: background 01.2s ease;
        cursor: default;
      }

      /* --- ICON ✓ bằng ::before ---
      Gợi ý:
        content: '✓';
        position: absolute;
        left: 14px;
        top: 50%;
        transform: translateY(-50%);
        color: #27ae60;
        font-weight: 700;
        font-size: 16px;
    */
      .feature-list li::before {
        content: "✅";
        position: absolute;
        left: 14px;
        top: 50%;
        transform: translateY(-50%);
        color: #27ae60;
        font-weight: 700;
        font-size: 16px;
      }

      /* --- HOVER ---
      Gợi ý: background: #EEF5FF;
    */
      .feature-list li:hover {
        background: #eef5ff;
      }

      /* --- DÒNG CUỐI — bỏ border-bottom --- */
      .feature-list li:last-child {
        border-bottom: none;
      }
    </style>
  </head>
  <body>
    <h2 class="section-title">Tính năng nổi bật</h2>

    <!-- DANH SÁCH — thêm nội dung vào các <li> -->
    <!-- LƯU Ý: KHÔNG thêm icon ✓ vào đây — phải làm bằng CSS ::before -->
    <ul class="feature-list">
      <li>1</li>
      <li>2</li>
      <li>3</li>
      <li>4</li>
      <li>5</li>
    </ul>
  </body>
</html>
